# ----------------------------------------------------- 
# Variables
# ----------------------------------------------------- 
$mainMod = SUPER # Sets "Windows" key as main modifier

# ----------------------------------------------------- 
# Applications
# ----------------------------------------------------- 
bind = $mainMod, T, exec, kitty                       # Open Terminal
bind = $mainMod, E, exec, thunar                      # Open File Manager
bind = $mainMod, A, exec, ~/.config/rofi/scripts/launcher_t2             # Open App Launcher
bind = $mainMod, F, exec, brave                       # Open Browser (Change to your preference)
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy # Clipboard

# ----------------------------------------------------- 
# Window Management
# ----------------------------------------------------- 
bind = $mainMod, Q, killactive,                       # Close window
bind = $mainMod, Space, togglefloating,               # Toggle Floating
bind = $mainMod, P, pseudo,                           # Dwindle effect
bind = $mainMod, J, togglesplit,                      # Change split direction

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ----------------------------------------------------- 
# Workspaces
# ----------------------------------------------------- 
# Switch to the next/previous workspace with mainMod + Control + Arrow Keys
bind = $mainMod CTRL, right, workspace, r+1
bind = $mainMod CTRL, left, workspace, r-1

# Move active window within the current workspace (Swap positions)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r

# Move active window to the next/prev workspace (Follow the window)
bind = $mainMod CTRL ALT, right, movetoworkspace, r+1
bind = $mainMod CTRL ALT, left, movetoworkspace, r-1

# Move active window to the next/prev workspace silently
bind = $mainMod CTRL SHIFT, right, movetoworkspacesilent, r+1
bind = $mainMod CTRL SHIFT, left, movetoworkspacesilent, r-1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# ----------------------------------------------------- 
# Functional Bindings (Audio/Brightness/Screenshots)
# ----------------------------------------------------- 
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f - # Screenshot tool
bind = $mainMod, L, exec, hyprlock                       # Lock Screen
bind = $mainMod, BackSpace, exec, ~/.config/rofi/scripts/powermenu_t1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ----------------------------------------------------
# Keybindings
# ----------------------------------------------------
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/keyhint.sh
